<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flos Cockpit</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0e17;color:#eef2f8;font:15px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
form{display:grid;gap:10px;max-width:360px;width:100%}
h1{font-size:22px;margin:0}
p{margin:0;color:#93a0b8;font-size:14px}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #243049;background:#111827;color:#eef2f8}
button{background:#33e0cc;color:#0a0e17;border:0;font-weight:600;cursor:pointer}
#msg{color:#ff6b6b}
</style>
</head>
<body>
<!-- Leere Hülle: enthält keine Daten. Lädt die Cockpit-Seite und alle Daten mit dem GitHub-Schlüssel aus dem privaten Repo wuaegner/firma-wissen.
     Quelle dieser Datei: firma-wissen/planung/dashboard/huelle/index.html -->
<form id="f" hidden>
  <h1>Flos Cockpit</h1>
  <p>GitHub-Schlüssel eingeben. Er bleibt nur in diesem Browser gespeichert.</p>
  <input id="t" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="GitHub-Schlüssel">
  <button>Öffnen</button>
  <p id="msg"></p>
</form>
<script>
(()=>{ // IIFE: keine globalen Namen, die mit der nachgeladenen Seite kollidieren
const REPO="wuaegner/firma-wissen",TK="fw-gh-token";
const get=()=>{try{return localStorage.getItem(TK)}catch(e){return null}};
async function start(tok){
  const r=await fetch(`https://api.github.com/repos/${REPO}/contents/planung/dashboard/cockpit.html?ref=main`,{headers:{Authorization:"Bearer "+tok,Accept:"application/vnd.github.raw","X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"});
  if(r.status===401||r.status===403||r.status===404)throw new Error("Schlüssel abgelehnt (GitHub "+r.status+").");
  if(!r.ok)throw new Error("GitHub "+r.status);
  const page=await r.text();
  document.open();
  document.write('<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+page+'</body></html>');
  document.close();
}
const f=document.getElementById("f"),msg=document.getElementById("msg");
const tok=get();
if(tok)start(tok).catch(e=>{try{localStorage.removeItem(TK)}catch(x){}f.hidden=false;msg.textContent=e.message});
else f.hidden=false;
f.addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("t").value.trim();if(!v)return;
  try{localStorage.setItem(TK,v)}catch(x){}
  start(v).catch(err=>{try{localStorage.removeItem(TK)}catch(x){}msg.textContent=err.message});
});
})();
</script>
</body>
</html>
